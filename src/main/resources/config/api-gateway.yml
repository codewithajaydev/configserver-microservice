server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://13.205.8.126:8443/realms/fitness-oauth2/protocol/openid-connect/certs

  cloud:
    gateway:
      httpclient:
        ssl:
          useInsecureTrustManager: true

      routes:
        - id: user-service
          uri: https://user-fitness-microservices.onrender.com
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: https://activityservice-fitness-1.onrender.com
          predicates:
            - Path=/api/activities/**

        - id: ai-service
          uri: https://aiservice-fitness.onrender.com
          predicates:
            - Path=/api/recommendations/**


